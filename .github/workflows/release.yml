name: release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download CI artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Package release artifacts
        run: |
          mkdir -p release
          tar -czf release/envy-linux-x86_64.tar.gz -C artifacts/envy-linux-x64-main envy
          tar -czf release/envy-linux-arm64.tar.gz -C artifacts/envy-linux-arm64-main envy
          tar -czf release/envy-darwin-arm64.tar.gz -C artifacts/envy-macos-arm64-main envy
          tar -czf release/envy-darwin-x86_64.tar.gz -C artifacts/envy-macos-x64-main envy
          cd artifacts/envy-windows-x64-main && zip ../../release/envy-windows-x86_64.zip envy.exe && cd ../..
          cd artifacts/envy-windows-arm64-main && zip ../../release/envy-windows-arm64.zip envy.exe

      # Names must be bare, not release/-prefixed: a bootstrap script looks up its own
      # archive by basename. Sorted so the file is byte-reproducible across runs -- a
      # project's `@envy sha256sums` pins this file's own hash, and `envy mirror-envy`
      # republishes it verbatim, so gratuitous ordering churn would invalidate pins.
      - name: Emit SHA256SUMS
        working-directory: release
        run: sha256sum $(ls | sort) > SHA256SUMS

      - name: Create release with artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            release/envy-linux-x86_64.tar.gz \
            release/envy-linux-arm64.tar.gz \
            release/envy-darwin-arm64.tar.gz \
            release/envy-darwin-x86_64.tar.gz \
            release/envy-windows-x86_64.zip \
            release/envy-windows-arm64.zip \
            release/SHA256SUMS \
            --repo ${{ github.repository }} \
            --generate-notes
